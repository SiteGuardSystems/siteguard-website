name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-24.04  # pinned: Playwright 1.56 has no chromium for ubuntu-26.04 (ubuntu-latest from Nov 2026)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install
      - name: Build and checks (links, banned words, page size, headers)
        run: npm test
      # WP-S1: the same dcr-check as SiteGuard-Forms-Storefront. The public
      # page-A DCR extract pinned in dcr.lock (vendored, no network or secrets)
      # against data/, content/ and the site's code: fails on a hash mismatch, a
      # code that doesn't resolve, a retired code shown or sold, a title that
      # differs from the DCR, a catalogue stamped with another revision or not
      # stamped, and a generated catalogue.json edited by hand.
      - name: dcr-check
        run: |
          rc=0
          npm run --silent dcr-check > dcr-check.txt || rc=$?
          cat dcr-check.txt
          { echo '### dcr-check'; echo '```'; cat dcr-check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      # Dan, 1 Nov 2026 (#94): one FORMS beta switch. The storefront's
      # data/site-mode.json is the source of truth; this site vendors it
      # (site-mode.lock). Fails if the copy was edited, this repo sets its own
      # beta, or the storefront's beta has moved on (public repo, no secrets).
      - name: site-mode drift check
        run: npm run --silent site-mode-check -- --upstream
      - name: Browser end-to-end
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
