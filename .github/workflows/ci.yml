name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install
      - name: Build and checks (links, banned words, page size, headers)
        run: npm test
      - name: Browser end-to-end
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
